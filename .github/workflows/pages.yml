name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static dashboard
        env:
          # Optional repo variable (Settings → Secrets and variables → Actions → Variables).
          # When set, visitors only need to paste the API token.
          ECHELON_API_URL: ${{ vars.ECHELON_API_URL }}
        run: |
          if [ -n "$ECHELON_API_URL" ]; then
            python web/build.py --api-url "$ECHELON_API_URL"
          else
            python web/build.py
          fi

      - name: Verify build output
        run: |
          test -f web/dist/index.html
          test -f web/dist/app.js
          ls -la web/dist

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
