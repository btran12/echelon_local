name: Publish dashboard to production branch

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Only repository contents need write access: this workflow commits the built
# site to a separate branch instead of deploying through the Pages API.
permissions:
  contents: write

concurrency:
  group: publish-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static dashboard
        env:
          # Optional repo variable (Settings → Secrets and variables → Actions → Variables).
          # When set, visitors only need to paste the API token.
          ECHELON_API_URL: ${{ vars.ECHELON_API_URL }}
        run: |
          if [ -n "$ECHELON_API_URL" ]; then
            python web/build.py --api-url "$ECHELON_API_URL"
          else
            python web/build.py
          fi

      - name: Verify build output
        run: |
          test -f web/dist/index.html
          test -f web/dist/app.js
          ls -la web/dist

      # Replaces the production branch with the freshly built site, so Pages can
      # serve it with Source = "Deploy from a branch" → production → / (root).
      - name: Publish to production branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd web/dist
          git init -q
          git checkout -q -b production
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish ${GITHUB_SHA:0:7} from ${GITHUB_REF_NAME}" --allow-empty
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" production
