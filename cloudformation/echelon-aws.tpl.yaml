AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Echelon BLE telemetry control plane. API Gateway + Lambda + DynamoDB.
  The Bluetooth bridge runs on a local machine (aws_agent.py), because AWS
  compute does not provide a Bluetooth radio.

Parameters:
  ApiToken:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: >-
      Shared secret sent as the x-api-token header by the local agent and by
      callers. Use a long random value.

  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "*"
    Description: >-
      Browser origins allowed to call the API (CORS), for example the GitHub
      Pages URL of the dashboard. Use * to allow any origin.

  TableName:
    Type: String
    Default: echelon-state
    MinLength: 3
    MaxLength: 255
    AllowedPattern: "[a-zA-Z0-9_.-]+"
    Description: DynamoDB table name for telemetry, events, and commands.

  LogRetentionDays:
    Type: Number
    Default: 14
    MinValue: 1
    MaxValue: 3653
    Description: CloudWatch Logs retention for the API Lambda.

Resources:
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt StateTable.Arn
                  - !Sub ${StateTable.Arn}/index/*

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api
      RetentionInDays: !Ref LogRetentionDays

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-api
      Runtime: python3.12
      Handler: index.handler
      Timeout: 15
      MemorySize: 256
      Role: !GetAtt ApiFunctionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref StateTable
          API_TOKEN: !Ref ApiToken
      Code:
        ZipFile: |
          # __LAMBDA_CODE__

  ApiFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowHeaders:
          - content-type
          - x-api-token
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        ExposeHeaders:
          - content-disposition
        MaxAge: 3600

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  RouteHealth:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /health
      Target: !Sub integrations/${ApiIntegration}

  RouteScan:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /scan
      Target: !Sub integrations/${ApiIntegration}

  RouteScanResult:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /scan-result
      Target: !Sub integrations/${ApiIntegration}

  RouteConnect:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /connect
      Target: !Sub integrations/${ApiIntegration}

  RouteDisconnect:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /disconnect
      Target: !Sub integrations/${ApiIntegration}

  RouteStatus:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /status
      Target: !Sub integrations/${ApiIntegration}

  RouteEvents:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /events
      Target: !Sub integrations/${ApiIntegration}

  RouteTelemetry:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /telemetry
      Target: !Sub integrations/${ApiIntegration}

  RouteScanResultPost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /scan-result
      Target: !Sub integrations/${ApiIntegration}

  RouteCommands:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /commands
      Target: !Sub integrations/${ApiIntegration}

  RouteCommandAck:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /commands/{id}/ack
      Target: !Sub integrations/${ApiIntegration}

  RouteWorkoutsList:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /workouts
      Target: !Sub integrations/${ApiIntegration}

  RouteWorkoutsUpload:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /workouts
      Target: !Sub integrations/${ApiIntegration}

  RouteWorkoutActive:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /workouts/active
      Target: !Sub integrations/${ApiIntegration}

  RouteWorkoutStart:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /workouts/start
      Target: !Sub integrations/${ApiIntegration}

  RouteWorkoutStop:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /workouts/stop
      Target: !Sub integrations/${ApiIntegration}

  RouteWorkoutGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /workouts/{id}
      Target: !Sub integrations/${ApiIntegration}

  RouteWorkoutDelete:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: DELETE /workouts/{id}
      Target: !Sub integrations/${ApiIntegration}

  RouteStats:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /stats
      Target: !Sub integrations/${ApiIntegration}

  RouteExport:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /export.csv
      Target: !Sub integrations/${ApiIntegration}

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25

Outputs:
  ApiUrl:
    Description: Base URL for the Echelon AWS API.
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com

  StateTableName:
    Description: DynamoDB table used by the API and agent.
    Value: !Ref StateTable

  AgentSetup:
    Description: Environment variables for aws_agent.py on the BLE-capable machine.
    Value: !Sub |
      ECHELON_API_URL=https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
      ECHELON_API_TOKEN=<the ApiToken you supplied to CloudFormation>
